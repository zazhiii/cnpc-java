name: cnpc-system

services:
  mysql:
    image: mysql:8.0.33
    container_name: cnpc-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ruoyi-vue-pro}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${MYSQL_PORT:-3306}:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --explicit_defaults_for_timestamp=true
      - --lower_case_table_names=1
    volumes:
      - mysql:/var/lib/mysql
      - ../../sql/mysql/ruoyi-vue-pro.sql:/docker-entrypoint-initdb.d/01-ruoyi-vue-pro.sql:ro
      - ../../sql/mysql/quartz.sql:/docker-entrypoint-initdb.d/02-quartz.sql:ro
      - ../../sql/mysql/drill_image_import.sql:/docker-entrypoint-initdb.d/03-drill-image-import.sql:ro
      - ../../sql/mysql/drill_image_enhance.sql:/docker-entrypoint-initdb.d/04-drill-image-enhance.sql:ro
      - ../../sql/mysql/drill_app_collection.sql:/docker-entrypoint-initdb.d/05-drill-app-collection.sql:ro
      - ../../sql/mysql/oauth2_client_logo_migration.sql:/docker-entrypoint-initdb.d/06-oauth2-client-logo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - cnpc-network

  redis:
    image: redis:6.2-alpine
    container_name: cnpc-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${REDIS_PORT:-6379}:6379"
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - cnpc-network

  minio:
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    container_name: cnpc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${MINIO_API_PORT:-9000}:9000"
      - "${BIND_ADDRESS:-0.0.0.0}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - cnpc-network

  server:
    image: cnpc-server:latest
    container_name: cnpc-server
    restart: unless-stopped
    build:
      context: ../..
      dockerfile_inline: |
        FROM maven:3.9.9-eclipse-temurin-21 AS builder
        WORKDIR /build
        COPY . .
        RUN mvn -pl yudao-server -am -DskipTests clean package

        FROM eclipse-temurin:21-jre
        WORKDIR /yudao-server
        COPY --from=builder /build/yudao-server/target/yudao-server.jar app.jar
        ENV TZ=Asia/Shanghai
        ENV JAVA_OPTS="-Xms512m -Xmx512m -Djava.security.egd=file:/dev/./urandom"
        ENV ARGS=""
        EXPOSE 48080
        CMD java $${JAVA_OPTS} -jar app.jar $${ARGS}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx512m -Djava.security.egd=file:/dev/./urandom}
      ARGS: >-
        --spring.datasource.dynamic.datasource.master.url=${MASTER_DATASOURCE_URL:-jdbc:mysql://mysql:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true}
        --spring.datasource.dynamic.datasource.master.username=${MASTER_DATASOURCE_USERNAME:-root}
        --spring.datasource.dynamic.datasource.master.password=${MASTER_DATASOURCE_PASSWORD:-${MYSQL_ROOT_PASSWORD:-123456}}
        --spring.datasource.dynamic.datasource.slave.url=${SLAVE_DATASOURCE_URL:-jdbc:mysql://mysql:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true}
        --spring.datasource.dynamic.datasource.slave.username=${SLAVE_DATASOURCE_USERNAME:-root}
        --spring.datasource.dynamic.datasource.slave.password=${SLAVE_DATASOURCE_PASSWORD:-${MYSQL_ROOT_PASSWORD:-123456}}
        --spring.data.redis.host=redis
        --spring.data.redis.port=6379
        --spring.data.redis.password=${REDIS_PASSWORD:-123456}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${SERVER_PORT:-48080}:48080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - cnpc-network

  admin:
    image: cnpc-admin:latest
    container_name: cnpc-admin
    restart: unless-stopped
    build:
      context: ../../../yudao-ui-admin-vue3
      args:
        VITE_BASE_URL: ${VITE_BASE_URL:-}
        VITE_API_URL: ${VITE_API_URL:-/admin-api}
      dockerfile_inline: |
        FROM node:20.19-alpine AS builder
        WORKDIR /app
        RUN corepack enable
        COPY package.json pnpm-lock.yaml pnpm-workspace.yaml ./
        RUN pnpm install --frozen-lockfile
        COPY . .
        ARG VITE_BASE_URL
        ARG VITE_API_URL
        ENV VITE_BASE_URL=$${VITE_BASE_URL}
        ENV VITE_API_URL=$${VITE_API_URL}
        RUN pnpm build:prod

        FROM nginx:1.27-alpine
        COPY --from=builder /app/dist-prod /usr/share/nginx/html
        EXPOSE 80
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${ADMIN_PORT:-8080}:80"
    configs:
      - source: admin-nginx
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - server
    networks:
      - cnpc-network

configs:
  admin-nginx:
    content: |
      server {
        listen 80;
        server_name _;
        client_max_body_size 200m;

        location /admin-api/ {
          proxy_pass http://server:48080/admin-api/;
          proxy_http_version 1.1;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_read_timeout 300s;
        }

        location / {
          root /usr/share/nginx/html;
          index index.html;
          try_files $$uri $$uri/ /index.html;
        }
      }

networks:
  cnpc-network:
    driver: bridge

volumes:
  mysql:
    driver: local
  redis:
    driver: local
  minio:
    driver: local
